<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ePillar - Smartphone Orchestra Pillar</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        #status-registry {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            width: 80%;
            max-width: 400px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background: #222;
            margin-left: 10px;
        }
        .active { background: #ffaa44; box-shadow: 0 0 8px #ffaa44; }
        .ready { background: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
        #ready-btn {
            padding: 18px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            background: #ffaa44;
            color: #000;
            cursor: pointer;
        }
        #ready-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        #show-screen { display: none; height: 100vh; width: 100vw; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
        #performance-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: monospace;
            font-size: 10px;
            color: #ffaa44;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .pillar-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: monospace;
            font-size: 9px;
            color: #888;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .visualizer {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .visualizer-fill {
            height: 100%;
            width: 0%;
            background: #ffaa44;
            transition: width 0.1s linear;
        }
        .error-text {
            color: #ff6666;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="setup-screen">
        <h1 id="seat-label">Identifying Pillar...</h1>
        <div id="status-registry">
            <div class="status-item">
                <span>Identity Resolve</span>
                <span id="id-ind" class="indicator"></span>
            </div>
            <div class="status-item">
                <span>Clock Synchronization</span>
                <span id="sync-ind" class="indicator"></span>
            </div>
            <div class="status-item">
                <span>Audio Loaded</span>
                <span id="audio-ind" class="indicator"></span>
            </div>
        </div>
        <button id="ready-btn" disabled>ACTIVATE PILLAR</button>
        <p id="system-msg" style="margin-top:20px; font-size: 0.8rem; color: #888;">Waiting for Audio Context...</p>
        <div id="error-msg" class="error-text" style="display: none;"></div>
    </div>
    <div id="show-screen">
        <div id="performance-overlay">Pillar: -- | Status: Waiting</div>
        <canvas id="stage-canvas"></canvas>
        <div class="pillar-badge" id="pillar-badge">ePillar v1.0</div>
        <div class="visualizer" id="visualizer">
            <div class="visualizer-fill" id="visualizer-fill"></div>
        </div>
    </div>

</body>
<script>
    // ==================== FIREBASE CONFIGURATION ====================
    // Firebase setup, clock and pillar_config loading live in config.js
    const db = SO.db;

    // ==================== STATE VARIABLES ====================
    let audioCtx = null;
    let mySeat = null;
    let serverOffset = 0;
    let isActive = false;
    let heartbeatInterval = null;
    let animationFrame = null;
    let isPlaying = false;
    let currentPlaybackType = null;
    let currentSessionId = null;
    let pillarConfig = {};

    // Web Audio playback state
    const bufferCache = new Map();   // url -> Promise<AudioBuffer>; each file is downloaded and decoded once
    let primedBuffers = new Set();
    let currentSource = null;        // the AudioBufferSourceNode playing (or scheduled) now
    let playStartCtx = 0;            // audio-clock time at which the file's beginning would sound
    let playDuration = 0;
    let startWatch = null;           // timer that updates the screen when the scheduled start arrives
    let scheduleToken = 0;           // bumps on every new cue or stop, so a slow download can't start a stale cue

    // Constants
    const HEARTBEAT_INTERVAL_MS = 10000;

    // ==================== UTILITY FUNCTIONS ====================
    function log(message, eventType = "log", meta = {}) {
        const timestamp = SO.now();
        const pillarId = mySeat?.id || 'unknown';
        console.log(`[${new Date(timestamp).toISOString().substr(11, 12)}] [${pillarId}] ${message}`);
    }

    // ==================== CLOCK SYNC WITH LOGGING ====================
    // Clock comes from config.js (SO.now(): monotonic, measured with SO.clock.sync()).
    SO.onClockSync((offset, status) => {
        serverOffset = offset;
        if (status) log(`🕰️ Clock ${status.changeMs != null ? 'recheck: ' + (status.changeMs > 0 ? '+' : '') + status.changeMs + ' ms' : 'measured'} (±${status.uncertaintyMs} ms)`);
        document.getElementById('sync-ind').className = 'indicator active';
    });

    // ==================== AUDIO FILES (decoded once) ====================
    // Shared with every page through config.js: one download and decode per file.
    function getBuffer(url) {
        return SO.audio.getBuffer(audioCtx, url);
    }

    // ==================== HARDWARE PRIMING ====================
    // Plays the first 0.1 s of the real file almost silently, so the speaker path is awake.
    async function primeWithWaveform(audioUrl) {
        if (!audioCtx || audioCtx.state !== 'running') {
            log(`⚠️ Cannot prime – audio context not running`, 'warn');
            return false;
        }
        try {
            const buffer = await getBuffer(audioUrl);
            if (primedBuffers.has(audioUrl)) return true;
            SO.audio.primeBuffer(audioCtx, buffer);   // 0.1 s at gain 0.001
            primedBuffers.add(audioUrl);
            log(`🔊 Primed hardware with 100 ms of ${audioUrl.split('/').pop()} (gain=0.001)`);
            return true;
        } catch (e) {
            log(`❌ Priming failed for ${audioUrl.split('/').pop()}: ${e.message}`, 'error');
            return false;
        }
    }

    // Decodes every pillar asset for this pillar found in show/movements, in the background,
    // so a GO cue never waits for a download.
    async function preloadShowAssets() {
        try {
            const movements = (await db.ref('show/movements').once('value')).val();
            const urls = new Set();
            // this pillar's tuba calibration file (tuning_mode/tuba/audio_urls, keyed FL or PILLAR_FL)
            const tuba = (await db.ref('tuning_mode/tuba/audio_urls').once('value')).val() || {};
            Object.entries(tuba).forEach(([k, u]) => { if (u && (k === mySeat.id || 'PILLAR_' + k === mySeat.id)) urls.add(u); });
            (function scan(o) {
                if (!o || typeof o !== 'object') return;
                if (o.type === 'pillar' && o.id === mySeat.id && o.audio_url) urls.add(o.audio_url);
                Object.values(o).forEach(scan);
            })(movements);
            if (!urls.size) return;
            log(`📥 Preloading ${urls.size} show/tuba file(s) for ${mySeat.id}`);
            for (const url of urls) await getBuffer(url).catch(e => log(`⚠️ Preload failed for ${url.split('/').pop()}: ${e.message}`));
        } catch (e) {
            log(`⚠️ Could not preload show files: ${e.message}`);
        }
    }

    // ==================== IDENTITY RESOLUTION ====================
    async function resolveIdentity() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const seatId = urlParams.get('seat');

            log(`🔍 Resolving identity for seat: ${seatId}`);

            if (!seatId || !seatId.startsWith('PILLAR_')) {
                log(`❌ Invalid pillar ID: ${seatId}`);
                document.getElementById('id-ind').className = 'indicator error';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').innerHTML = `Invalid pillar ID: ${seatId}<br>Expected format: ?seat=PILLAR_FL, PILLAR_FR, PILLAR_BL, or PILLAR_BR`;
                return false;
            }

            // First, try to get pillar config to verify the ID exists
            const configSnap = await db.ref('pillar_config').once('value');
            const configData = configSnap.val();

            let found = false;
            if (configData && configData.pillars) {
                found = configData.pillars.some(p => p.id === seatId);
            }

            if (!found) {
                log(`⚠️ Pillar ${seatId} not found in pillar_config, but will still proceed (may be added later)`);
            }

            mySeat = { id: seatId };
            document.getElementById('seat-label').innerText = `Pillar ${seatId}`;
            document.getElementById('id-ind').className = 'indicator active';
            document.getElementById('pillar-badge').innerHTML = `🎵 ${seatId} | ePillar v1.0`;
            document.getElementById('performance-overlay').innerHTML = `Pillar: ${seatId} | Status: Ready`;
            log(`✅ Resolved pillar: ${mySeat.id}`);

            // Enable the activate button once identity is resolved
            document.getElementById('ready-btn').disabled = false;
            document.getElementById('system-msg').innerHTML = "✅ Identity resolved. Tap to activate.";

            return true;
        } catch (e) {
            log(`❌ Identity Resolution Error: ${e.message}`);
            document.getElementById('id-ind').className = 'indicator error';
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').innerHTML = `Error: ${e.message}`;
            return false;
        }
    }

    // ==================== PILLAR CONFIGURATION ====================
    // Reads pillar_config from Firebase through config.js and keeps it up to date, so delay
    // changes made on the admin page reach this pillar without reloading. Missing values
    // are filled from SO.FALLBACK and shown in an orange warning box.
    function applyPillarConfig(cfg) {
        if (!cfg) {
            SO.showWarning('pillar', ['No pillar_config in Firebase. Upload it from the admin page.']);
            document.getElementById('audio-ind').className = 'indicator error';
            return false;
        }
        pillarConfig = cfg.pillars;
        const mine = pillarConfig[mySeat?.id];
        const myWarnings = cfg.warnings.filter(w => w.startsWith(mySeat?.id + ':'));
        if (!mine) myWarnings.unshift(`${mySeat?.id} is not listed in pillar_config.`);
        SO.showWarning('pillar', myWarnings);
        if (mine && mine.audioUrl) {
            document.getElementById('audio-ind').className = 'indicator active';
            log(`📡 pillar_config: speaker ${mine.speakerDelayMs} ms, mic ${mine.micDelayMs} ms${mine.assumed.length ? ' (ASSUMED: ' + mine.assumed.join(', ') + ')' : ''}`);
            return true;
        }
        document.getElementById('audio-ind').className = 'indicator error';
        return false;
    }

    async function loadPillarConfig() {
        try {
            const ok = applyPillarConfig(await SO.loadPillarConfig());
            SO.watchPillarConfig(applyPillarConfig);   // live updates from the admin page
            return ok;
        } catch (e) {
            log(`⚠️ Failed to load pillar config: ${e.message}`);
            SO.showWarning('pillar', [`Could not load pillar_config: ${e.message}`]);
            document.getElementById('audio-ind').className = 'indicator error';
            return false;
        }
    }

    // ==================== VISUALIZER ====================
    function startVisualizer() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        function updateVisualizer() {
            if (currentSource && isPlaying && playDuration > 0) {
                const percent = Math.min(100, Math.max(0, (audioCtx.currentTime - playStartCtx) / playDuration * 100));
                document.getElementById('visualizer-fill').style.width = percent + '%';
            }
            animationFrame = requestAnimationFrame(updateVisualizer);
        }
        updateVisualizer();
    }

    function stopVisualizer() {
        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
        document.getElementById('visualizer-fill').style.width = '0%';
    }

    // ==================== SCHEDULE PLAYBACK ====================
    let currentPlaybackStartTime = 0;

    // startTime is the server time (ms) at which the sound should be heard. The source is started
    // speakerDelayMs earlier, on the audio clock, with source.start(when): sample-accurate, no timers.
    // If the cue arrives late (up to 5 s), the file is joined part-way so it stays in sync.
    async function schedulePlayback(startTime, audioUrl, type = 'show') {
        const myConfig = pillarConfig[mySeat.id];
        const url = audioUrl || myConfig?.audioUrl;
        if (!url) {
            log(`❌ Cannot schedule - no audio URL for ${mySeat.id}`);
            return;
        }
        if (!audioCtx) {
            log(`❌ Cannot schedule - audio not started (tap ACTIVATE PILLAR)`);
            return;
        }
        if (audioCtx.state === 'suspended') await audioCtx.resume().catch(() => {});

        stopPlayback();
        const token = ++scheduleToken;

        let buffer;
        try {
            buffer = await getBuffer(url);
        } catch (e) {
            log(`❌ Could not load ${url.split('/').pop()}: ${e.message}`);
            return;
        }
        if (token !== scheduleToken) return;   // a newer cue or a stop arrived while loading

        const speakerDelay = myConfig?.speakerDelayMs ?? SO.FALLBACK.speakerDelayMs;
        const sourceStartServer = startTime - speakerDelay;          // when the source must start

        // Shared scheduler (config.js): audio-clock start, joins part-way if late, skips if > 5 s late
        const r = SO.audio.playAt(audioCtx, buffer, startTime, { leadMs: speakerDelay, gain: 1.0 });
        if (r.skipped) {
            log(`❌ Cue skipped (${type}): ${r.reason}`);
            return;
        }
        const { source, when, offset, lateMs } = r;
        if (lateMs > 0) log(`⚠️ Cue arrived ${Math.round(lateMs)} ms late: joining ${offset.toFixed(3)} s into the file to stay in sync`);

        currentSource = source;
        playStartCtx = when - offset;
        playDuration = buffer.duration;
        currentPlaybackType = type;
        currentPlaybackStartTime = startTime;

        log(`🎵 ${mySeat.id} ${type}: source starts ${Math.max(0, -lateMs).toFixed(0)} ms from now (audio clock ${when.toFixed(3)} s, speaker delay ${speakerDelay} ms)`);

        source.onended = () => {
            if (currentSource !== source) return;   // stopped or replaced, not finished
            if (type === 'show') SO.clock.recheck().catch(() => {});   // end of a movement (not after calibration sounds)
            currentSource = null;
            isPlaying = false;
            log(`🔊 Pillar ${mySeat.id} FINISHED playing`);
            document.getElementById('performance-overlay').innerHTML = `Pillar: ${mySeat.id} | Status: Ready`;
            stopVisualizer();
        };

        // Screen and sync record when the start arrives (display only; the audio is already scheduled)
        startWatch = setTimeout(() => {
            startWatch = null;
            if (currentSource !== source) return;
            isPlaying = true;
            db.ref(`pillar_sync/${mySeat.id}/${Date.now()}`).set({
                pillarId: mySeat.id,
                method: 'webaudio',
                expectedStart: startTime,               // when the sound should be heard (server ms)
                sourceStart: sourceStartServer,         // when the source was told to start (server ms)
                lateJoinMs: Math.max(0, Math.round(lateMs)),
                speakerDelay: speakerDelay,
                playbackType: type,
                timestamp: SO.now()
            }).catch(e => log(`⚠️ Failed to log sync data: ${e.message}`));

            document.getElementById('performance-overlay').innerHTML =
                `Pillar: ${mySeat.id} | Status: PLAYING (${type}) | Delay: ${speakerDelay}ms` +
                (lateMs > 0 ? ` | joined ${Math.round(lateMs)}ms late` : '');
            const canvas = document.getElementById('stage-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffaa44';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 200);
            startVisualizer();
        }, Math.max(0, (when - audioCtx.currentTime) * 1000));
    }

    function stopPlayback() {
        scheduleToken++;
        if (startWatch) {
            clearTimeout(startWatch);
            startWatch = null;
        }
        if (currentSource) {
            const s = currentSource;
            currentSource = null;
            try { s.stop(); } catch (e) { /* not started yet or already stopped */ }
            try { s.disconnect(); } catch (e) {}
            log(`⏹️ Playback stopped`);
        }
        isPlaying = false;
        currentPlaybackType = null;
        stopVisualizer();
    }

    // ==================== HEARTBEAT ====================
    function startHeartbeat() {
        if (!mySeat) return;
        if (heartbeatInterval) clearInterval(heartbeatInterval);

        heartbeatInterval = setInterval(() => {
            if (mySeat) {
                db.ref(`devices/${mySeat.id}`).update({
                    lastSeen: SO.now(),
                    status: isPlaying ? 'PLAYING' : 'ACTIVE',
                    type: 'pillar',
                    audioUrl: pillarConfig[mySeat.id]?.audioUrl?.split('/').pop() || 'none',
                    speakerDelay: pillarConfig[mySeat.id]?.speakerDelayMs,
                    micDelay: pillarConfig[mySeat.id]?.micDelayMs,
                    isPlaying: isPlaying,
                    playbackType: currentPlaybackType,
                    x: pillarConfig[mySeat.id]?.x || 0,
                    y: pillarConfig[mySeat.id]?.y || 0
                });
            }
        }, HEARTBEAT_INTERVAL_MS);
        log(`💓 Heartbeat started for ${mySeat.id}`);
    }

    function stopHeartbeat() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
    }

    // ==================== TUNING LISTENER ====================
    function listenForTuning() {
        db.ref('tuning/current').on('value', async snap => {
            const schedule = snap.val();
            if (!schedule) {
                if (currentSource) {
                    log(`⚠️ Tuning schedule cleared`);
                    stopPlayback();
                }
                return;
            }

            if (!schedule.startTime) {
                log(`⚠️ Schedule has no startTime`);
                return;
            }

            // --- Handle MIC_CAL (tuba calibration) ---
            if (schedule.type === 'MIC_CAL' && schedule.instrument === 'tuba') {
                if (schedule.pillar === mySeat.id) {
                    log(`📯 Tuba calibration from ${schedule.pillar}`);
                    const audioUrl = schedule.audio_url;
                    stopPlayback();
                    schedulePlayback(schedule.startTime, audioUrl, 'tuba_cal');
                } else {
                    // This calibration is for another pillar – ignore completely
                    log(`🔇 Ignoring tuba calibration for ${schedule.pillar} (this is ${mySeat.id})`);
                }
                return;
            }

            // --- Normal tuning (piccolo) ---
            // Safety: ensure this is actually a tuning movement (has notes or schedule)
            const isValidTuning = schedule.piano_notes || schedule.schedule || schedule.deviceOrder;
            if (!isValidTuning) {
                log(`⚠️ Received unknown tuning schedule (no piano_notes/schedule/deviceOrder), ignoring`);
                return;
            }

            const now = SO.now();
            const conductorStartTime = schedule.startTime;
            const timeToStart = conductorStartTime - now;

            log(`🎵 Tuning schedule received! Time to start: ${(timeToStart / 1000).toFixed(3)}s`);

            stopPlayback();
            // Recheck the clock right before calibration; finishes at least 1.5 s before the start
            await SO.clock.recheckBefore(schedule.startTime).catch(e => log(`⚠️ Pre-calibration clock recheck failed: ${e.message}`));
            schedulePlayback(schedule.startTime, null, 'tuning');
        });
    }

    // ==================== SHOW MOVEMENT LISTENER ====================
    function listenForShowMovement() {
        db.ref('show/currentCue').on('value', snap => {
            const cue = snap.val();
            if (!cue) return;

            if (cue.action === 'KILL') {
                log(`💀 KILL signal received - stopping playback`);
                stopPlayback();
                stopHeartbeat();
                setTimeout(() => location.reload(), 500);
                return;
            }

            if (cue.action === 'GO' && cue.startTime && cue.movement && cue.cues) {
                log(`🎭 Show movement received: "${cue.movement}"`);

                let foundPillarAsset = null;
                for (const movementCue of cue.cues) {
                    if (movementCue.assets) {
                        for (const asset of movementCue.assets) {
                            if (asset.type === 'pillar' && asset.id === mySeat.id) {
                                foundPillarAsset = asset;
                                break;
                            }
                        }
                    }
                    if (foundPillarAsset) break;
                }

                if (foundPillarAsset && foundPillarAsset.audio_url) {
                    log(`🎵 Found pillar asset for ${mySeat.id}`);
                    stopPlayback();
                    schedulePlayback(cue.startTime, foundPillarAsset.audio_url, 'show');
                } else {
                    log(`⚠️ No pillar asset found for ${mySeat.id} in movement "${cue.movement}"`);
                }
            }
        });
    }

    // ==================== AUDIO CONTEXT ====================
    async function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            log(`🎛️ Audio context created (state: ${audioCtx.state}, ${audioCtx.sampleRate} Hz, base latency ${Math.round((audioCtx.baseLatency || 0) * 1000)} ms)`);
            if (audioCtx.state === 'suspended') {
                document.body.addEventListener('click', () => {
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                        log(`🎛️ Audio context resumed by user interaction`);
                    }
                }, { once: true });
            }
            return true;
        } catch (e) {
            log(`⚠️ Audio context not available: ${e.message}`);
            return false;
        }
    }

    // ==================== TEST TONE ====================
    function playTestTone() {
        if (audioCtx && audioCtx.state === 'running') {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                log(`🔊 Test tone played (440Hz)`);
            } catch (e) {
                log(`⚠️ Could not play test tone: ${e.message}`);
            }
        }
    }

    // ==================== ACTIVATE PILLAR ====================
    async function activatePillar() {
        await initAudio();

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('show-screen').style.display = 'block';

        const canvas = document.getElementById('stage-canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        isActive = true;
        startHeartbeat();

        // Measure the clock before the pillar plays anything
        SO.clock.setDeviceId(mySeat.id);
        try { await SO.clock.sync(); } catch (err) { log(`⚠️ Clock sync failed, using Firebase's estimate: ${err.message}`); }

        const myConfig = pillarConfig[mySeat.id];
        log(`🔊 Pillar ${mySeat.id} activated`);
        log(`   Audio: ${myConfig?.audioUrl?.split('/').pop() || 'none'}`);
        log(`   Speaker delay: ${myConfig?.speakerDelayMs}ms`);

        // Decode this pillar's own file once and prime the speaker with it
        if (myConfig && myConfig.audioUrl) {
            await primeWithWaveform(myConfig.audioUrl);
        }
        preloadShowAssets();   // background; GO cues won't wait for downloads

        setTimeout(() => playTestTone(), 500);

        listenForTuning();
        listenForShowMovement();
    }

    // ==================== INITIALIZATION ====================
    window.onload = async () => {
        log(`🎧 ePillar starting`);

        // Set a timeout to show error if identity resolution takes too long
        const timeoutId = setTimeout(() => {
            if (!mySeat) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').innerHTML = 'Timeout: Could not resolve pillar identity. Check Firebase connection and URL parameters.';
            }
        }, 10000);

        const idOk = await resolveIdentity();
        clearTimeout(timeoutId);

        if (!idOk) {
            document.getElementById('system-msg').innerHTML = "Failed to identify pillar. Check URL parameters.";
            document.getElementById('ready-btn').disabled = true;
            return;
        }

        await loadPillarConfig();

        const hasAudio = pillarConfig[mySeat.id]?.audioUrl;
        if (!hasAudio) {
            document.getElementById('system-msg').innerHTML = "No audio URL configured for this pillar in pillar_config.json";
            document.getElementById('ready-btn').disabled = true;
        } else {
            document.getElementById('ready-btn').disabled = false;
            document.getElementById('system-msg').innerHTML = "✅ Ready. Tap to activate.";
        }

        document.getElementById('ready-btn').onclick = async () => {
            await activatePillar();
        };
    };

    window.onresize = () => {
        const canvas = document.getElementById('stage-canvas');
        if (canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    };

    window.addEventListener('beforeunload', () => {
        stopPlayback();
        stopHeartbeat();
    });
</script>
</html>
