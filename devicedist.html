                rawTimeShifts = [];
                pillarSyncShifts = [];
                processedMeasurements.clear();
                localRecordings.clear();
                scheduledRecordings.clear();
                playedNotesCount = 0;
                neighborDetectionsCount = 0;
                neighborDetectionsPerNeighbor.clear();
                pillarDetectionsCount = 0;
                firstNoteLogged = false;
                log(`🎤 Phase 1: listening for mic delay using waveform detection (0-${phase1EndMs}ms)`);
            }

            if (!isListenOnlyMode) {
                const initDelay = currentSpeakerDelay !== null ? currentSpeakerDelay : estimatedDeviceDelayMs;
                log(`🎵 Starting playback with delay ${initDelay.toFixed(1)}ms`);
                startContinuousPlayback(tuningStartTime, initDelay);
            } else {
                log(`🔇 Listen‑only mode, no playback`);
            }

            await enableMicrophone();
            log("🎧 Listening...");
            startPeriodicLogging();

            // Schedule waveform‑based pillar recordings for Phase 1
            if (!isListenOnlyMode && pillarWindows.length && activePillars.length) {
                await loadPillarTemplates();   // normally already done at preload; instant then
                schedulePillarRecordings();
                // Set a timeout to fall back to default mic delay if no detections
                setTimeout(() => {
                    if (phase1WindowActive && !phase1Complete) {
                        log(`⏱️ Phase 1 timeout, using default mic delay`);
                        phase1WindowActive = false;
                        phase1Complete = true;
                        myMicDelayMs = micDelaySamples.length ? calculateMedian(micDelaySamples) : estimatedDeviceMicDelayMs;
                        updateCalibrationDisplay();
                    }
                }, phase1EndMs);
            }
        });
    }

    // ============================================================================
    // SHOW PLAYBACK & SPEAKER_CAL HANDLER
    // ============================================================================
    // ==================== KEEP AWAKE ====================
    // Phones sit in seat bags for the whole show. The browser releases the screen wake lock
    // whenever the page is hidden (notification shade, a text, app switch, screen lock), so it is
    // re-requested every time the page becomes visible again. Wake-lock state, battery, audio
    // state and visibility go into every heartbeat so the conductor sees phones at risk.
    let wakeLockState = ('wakeLock' in navigator) ? 'not requested' : 'unsupported';
    let showModeEntered = false;
    let hiddenSince = null;
    let battery = null;
    if (navigator.getBattery) navigator.getBattery().then(b => {
        battery = b;
        b.addEventListener('levelchange', () => { if (b.level <= 0.15 && !b.charging) log(`🪫 Battery ${Math.round(b.level * 100)}%`, 'warn'); });
    }).catch(() => {});   // not available on iPhone/Safari or Firefox

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) { wakeLockState = 'unsupported'; log(`⚠️ No screen wake lock on this browser; the screen may sleep`, 'warn'); return; }
        if (document.visibilityState !== 'visible') return;   // can only be requested while visible
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLockState = 'held';
            wakeLock.addEventListener('release', () => {
                wakeLockState = 'released';
                log(`🔅 Screen wake lock released`, 'warn');
            });
            log(`🔆 Screen wake lock held`);
        } catch (e) {
            wakeLockState = 'failed';
            log(`⚠️ Wake lock request failed: ${e.name} ${e.message}`, 'warn');
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (!showModeEntered) return;
        if (document.visibilityState === 'hidden') {
            hiddenSince = SO.now();
            log(`🙈 Page hidden`, 'warn');
            sendHeartbeat();   // last word before timers are throttled, so the conductor knows why
            return;
        }
        const away = hiddenSince ? Math.round((SO.now() - hiddenSince) / 1000) : 0;
        hiddenSince = null;
        log(`👀 Page visible again after ${away} s`, 'info');
        if (audioCtx && audioCtx.state !== 'running') {
            try { await audioCtx.resume(); } catch (e) {}
            log(`🎛️ Audio engine ${audioCtx.state} after returning`, audioCtx.state === 'running' ? 'info' : 'warn');
        }
        await requestWakeLock();
        sendHeartbeat();
    });
    // ============================================================================
    // LIGHTS THAT FOLLOW THE MUSIC (built during the mixdown, drawn on the audio clock)
    // ============================================================================
    // While a stem is mixed, the phone also measures how loud it is at this seat, LIGHT.FPS
    // times a second: loudness relative to the stem's own loudest moment × this seat's level for
    // the stem. That is smoothed (fast rise, slow fall, like a VU meter), tinted with the stem's
    // `color`, and added into one RGB track per movement. A stem with "color": "none" gives no light.
    // The screen draws the frame for the sound being heard right now, using the same audio clock
    // ticks and the same speaker+mic lead as the sound itself.
    const LIGHT = {
        FPS: 60,                // light frames per second of music
        ATTACK_MS: 10,          // how fast light rises on a note
        RELEASE_MS: 200,        // how fast it fades after
        MAX_FLASHES_PER_S: 3,   // photosensitivity limit; extra flashes are filled in (light held up)
        FLASH_DELTA: 0.1,       // a "flash" = relative luminance falls and rises again by this much
        DISPLAY_LAG_MS: 0       // screen lag compensation; tune in rehearsal if lights look late
    };

    function lightColor(c) {
        if (c === 'none') return null;
        const m = /^#?([0-9a-f]{6})$/i.exec(c || '');
        if (!m) return [1, 1, 1];
        const n = parseInt(m[1], 16);
        return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
    }

    function growLight(acc, frames) {
        if (acc.rgb.length >= frames * 3) return;
        const bigger = new Float32Array(Math.ceil(frames * 1.1) * 3);
        bigger.set(acc.rgb); acc.rgb = bigger;
    }

    // Adds one stem's light into acc (the movement's RGB track).
    async function addStemLight(acc, chans, startSample, rate, stem, gainAtT, entry) {
        const color = lightColor(stem.color);
        if (!color) return;
        const fps = LIGHT.FPS, nc = chans.length, len = chans[0].length;
        const f0 = Math.floor(startSample * fps / rate);
        const n = Math.ceil((startSample + len) * fps / rate) - f0;
        const rms = new Float32Array(n);
        let peak = 0;
        for (let f = 0; f < n; f++) {
            const a = Math.max(0, Math.ceil((f0 + f) * rate / fps) - startSample);
            const b = Math.min(len, Math.ceil((f0 + f + 1) * rate / fps) - startSample);
            let ss = 0;
            for (let k = a; k < b; k++) {
                let s = chans[0][k];
                if (nc > 1) { for (let c = 1; c < nc; c++) s += chans[c][k]; s /= nc; }
                ss += s * s;
            }
            const v = b > a ? Math.sqrt(ss / (b - a)) : 0;
            rms[f] = v; if (v > peak) peak = v;
            if (f % (fps * 4) === fps * 4 - 1) {
                await new Promise(r => setTimeout(r, 0));
                if (entry.cancelled) throw cancelledError();
            }
        }
        if (peak === 0) return;
        growLight(acc, f0 + n);
        const dt = 1000 / fps;
        const up = 1 - Math.exp(-dt / LIGHT.ATTACK_MS), down = 1 - Math.exp(-dt / LIGHT.RELEASE_MS);
        let env = 0;
        for (let f = 0; f < n; f++) {
            const tStem = (f0 + f + 0.5) / fps - startSample / rate;
            const target = (rms[f] / peak) * gainAtT(Math.max(0, tStem));
            env += (target - env) * (target > env ? up : down);
            const o = (f0 + f) * 3;
            acc.rgb[o] += color[0] * env; acc.rgb[o + 1] += color[1] * env; acc.rgb[o + 2] += color[2] * env;
        }
        acc.frames = Math.max(acc.frames, f0 + n);
    }

    // Clamp to 0..1 and remove flashes beyond MAX_FLASHES_PER_S (fills the dip between
    // the last bright frame and the new one, so the light stays up instead of flashing).
    function finishLight(acc) {
        const fps = LIGHT.FPS, rgb = acc.rgb.subarray(0, acc.frames * 3);
        for (let i = 0; i < rgb.length; i++) rgb[i] = Math.min(1, Math.max(0, rgb[i]));
        const lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        const lum = i => 0.2126 * lin(rgb[i * 3]) + 0.7152 * lin(rgb[i * 3 + 1]) + 0.0722 * lin(rgb[i * 3 + 2]);
        let peakIdx = 0, peakL = acc.frames ? lum(0) : 0, minL = peakL, filled = 0;
        const flashes = [];
        for (let i = 1; i < acc.frames; i++) {
            const L = lum(i);
            if (L < minL) minL = L;
            if (peakL - minL >= LIGHT.FLASH_DELTA && L - minL >= LIGHT.FLASH_DELTA) {
                while (flashes.length && flashes[0] <= i - fps) flashes.shift();
                if (flashes.length < LIGHT.MAX_FLASHES_PER_S) {
                    flashes.push(i);
                } else {   // too many: hold the light up through the dip
                    for (let k = peakIdx + 1; k < i; k++) {
                        const u = (k - peakIdx) / (i - peakIdx);
                        for (let c = 0; c < 3; c++) {
                            const v = rgb[peakIdx * 3 + c] + (rgb[i * 3 + c] - rgb[peakIdx * 3 + c]) * u;
                            if (v > rgb[k * 3 + c]) rgb[k * 3 + c] = v;
                        }
                    }
                    filled++;
                }
                peakIdx = i; peakL = L; minL = L;
            } else if (L > peakL && peakL - minL < LIGHT.FLASH_DELTA) {
                peakIdx = i; peakL = L; minL = L;
            }
        }
        return { fps, frames: acc.frames, rgb: rgb.slice(), flashesHeld: filled };
    }

    // --- Drawing: the frame for the sound being heard now ---------------------
    const audioClock = { ct: -1, perf: 0 };
    function audioNow(perfNow) {   // audioCtx.currentTime, smoothed between its updates
        const ct = audioCtx.currentTime;
        if (ct !== audioClock.ct) { audioClock.ct = ct; audioClock.perf = perfNow; }
        return ct + Math.min(0.05, Math.max(0, (perfNow - audioClock.perf) / 1000));
    }
    let lastLightCss = '';
    function drawLights(perfNow) {
        if (!audioCtx || !showModeEntered) return;
        const canvas = document.getElementById('stage-canvas');
        if (!canvas) return;
        const t = audioNow(perfNow) + LIGHT.DISPLAY_LAG_MS / 1000;
        let r = 0, g = 0, b = 0;
        for (const p of playingMovements.values()) {
            const L = p.entry.light;
            if (!L) continue;
            const pos = p.offset + (t - p.when) - p.leadSec;   // music position heard now
            if (pos < 0) continue;
            const x = pos * L.fps, i = Math.floor(x);
            if (i + 1 >= L.frames) continue;
            const u = x - i, a = L.rgb, o = i * 3;
            r += a[o] + (a[o + 3] - a[o]) * u;
            g += a[o + 1] + (a[o + 4] - a[o + 1]) * u;
            b += a[o + 2] + (a[o + 5] - a[o + 2]) * u;
        }
        const css = `rgb(${Math.round(Math.min(1, r) * 255)},${Math.round(Math.min(1, g) * 255)},${Math.round(Math.min(1, b) * 255)})`;
        if (css === lastLightCss) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = css;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        lastLightCss = css;
    }

    // ============================================================================
    // SHOW AUDIO: ONE PER-SEAT MIXDOWN PER MOVEMENT
    // ============================================================================
    // At onboarding: download (not decode) every stem this seat will ever hear, into the
    // browser's disk cache (Cache Storage), so the show needs no network.
    // Before each movement: decode its stems one at a time, apply this seat's level for each
    // stem (SO.spatial: origin/dest/radius/rolloff), add them into ONE mono buffer, and drop
    // each stem as soon as it is added. Only the mix stays in memory.
    // Memory: a mix costs 4 bytes × MIX_SAMPLE_RATE × seconds (32 kHz: ~7.7 MB per minute,
    // ~77 MB for a 10-minute song). At most: playing movement(s) + the next one + one stem
    // being decoded.
    const MIX_SAMPLE_RATE = 32000;        // 16 kHz bandwidth: more than a phone speaker gives
    const MIX_CACHE_NAME = 'so-show-audio-v1';
    const MIX_YIELD_SAMPLES = 2 * MIX_SAMPLE_RATE;   // let the page breathe every 2 s of audio
    const MIX_GAIN_STEP = 32;             // moving sources: recompute the level every 32 samples
    let showMovements = [];               // show/movements, in performance order
    let stemMemory = new Map();           // url -> ArrayBuffer, only if Cache Storage is unavailable
    let stemCache = null;                 // Cache object, if available
    const mixes = new Map();              // movement name -> mix entry
    const playingMovements = new Map();   // movement name -> { source, gain, entry }
    let mixChain = Promise.resolve();     // one mix at a time keeps the memory peak down

    function movementName(m) { return m.movement_name || m.movement_id || ''; }

    // Which stems this seat hears in a movement, with when they start.
    function planMovement(cues) {
        const stems = [];
        (cues || []).forEach(cue => {
            if (cue.type !== 'MASTER_MEDIA_SYNC') return;
            const timeSec = +cue.time || 0;
            (cue.assets || []).forEach(a => {
                if (a.type === 'pillar' || !a.audio_url) return;          // pillars play on the tablets
                if (!SO.spatial.pathOk(a)) { log(`⚠️ Stem ${a.id}: missing originX/originY/radius, skipped`, 'warn'); return; }
                if (!SO.spatial.reachesSeat(a, mySeat)) return;            // never comes near this seat
                stems.push({ url: a.audio_url, timeSec, id: a.id, color: a.color ?? null,
                    asset: { originX: a.originX, originY: a.originY, destX: a.destX, destY: a.destY,
                             radius: a.radius, rolloff: a.rolloff, duration: a.duration } });
            });
        });
        return { stems, signature: JSON.stringify(stems) };
    }

    // --- Onboarding: download every stem this seat needs -------------------------
    async function downloadShowAudio(onProgress) {
        const snap = await db.ref('show/movements').once('value');
        const val = snap.val();
        showMovements = Array.isArray(val) ? val.filter(Boolean) : Object.values(val || {});
        const urls = new Set();
        showMovements.forEach(m => planMovement(m.cues).stems.forEach(s => urls.add(s.url)));
        try { if ('caches' in window) stemCache = await caches.open(MIX_CACHE_NAME); }
        catch (e) { log(`⚠️ Cache Storage unavailable (${e.message}); keeping stems in memory`, 'warn'); }
        if (stemCache) {   // forget stems from earlier shows
            for (const req of await stemCache.keys()) if (!urls.has(req.url)) await stemCache.delete(req);
        }
        let done = 0, bytes = 0, failed = 0;
        for (const url of urls) {
            try {
                if (stemCache && await stemCache.match(url)) { done++; onProgress?.(done, urls.size); continue; }
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                if (stemCache) {
                    const copy = res.clone();
                    await stemCache.put(url, res);
                    bytes += (await copy.arrayBuffer()).byteLength;
                } else {
                    const ab = await res.arrayBuffer();
                    stemMemory.set(url, ab);
                    bytes += ab.byteLength;
                }
            } catch (e) {
                failed++;
                log(`❌ Stem download failed ${url.split('/').pop()}: ${e.message}`, 'error');
            }
            done++; onProgress?.(done, urls.size);
        }
        log(`📦 Show audio: ${showMovements.length} movements, ${urls.size} stems for this seat` +
            `${bytes ? `, ${(bytes / 1048576).toFixed(1)} MB downloaded` : ' (already cached)'}` +
            `${failed ? `, ${failed} FAILED` : ''} → ${stemCache ? 'disk cache' : 'memory'}`, failed ? 'warn' : 'info');
        return failed === 0;
    }

    async function stemBytes(url) {
        if (stemCache) {
            const hit = await stemCache.match(url);
            if (hit) return hit.arrayBuffer();
        }
        if (stemMemory.has(url)) return stemMemory.get(url).slice(0);   // decode detaches its input
        log(`⚠️ Stem ${url.split('/').pop()} not downloaded; fetching during the show`, 'warn');
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.arrayBuffer();
    }

    // Decode at the mix rate (an OfflineAudioContext decodes at its own rate).
    let mixDecoder = null;
    function decodeStem(bytes) {
        const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!mixDecoder) mixDecoder = Offline ? new Offline(1, 1, MIX_SAMPLE_RATE) : audioCtx;
        return new Promise((resolve, reject) => {
            const p = mixDecoder.decodeAudioData(bytes, resolve, reject);   // old Safari: callbacks only
            if (p && p.then) p.then(resolve, reject);
        });
    }
    const mixRate = () => (window.OfflineAudioContext || window.webkitOfflineAudioContext) ? MIX_SAMPLE_RATE : audioCtx.sampleRate;

    function cancelledError() { const e = new Error('cancelled'); e.cancelled = true; return e; }

    async function buildMix(entry) {
        const rate = mixRate();
        const t0 = performance.now();
        let out = null, data = null, peak = 0;
        const lightAcc = { rgb: new Float32Array(0), frames: 0 };
        for (const stem of entry.plan.stems) {
            if (entry.cancelled) throw cancelledError();
            let buf = await decodeStem(await stemBytes(stem.url));
            if (entry.cancelled) throw cancelledError();
            const start = Math.round(stem.timeSec * rate);
            const need = start + buf.length;
            if (!out || need > out.length) {          // grow the mix (normally only for the first stem)
                const bigger = new AudioBuffer({ numberOfChannels: 1, length: need, sampleRate: rate });
                if (out) bigger.copyToChannel(data, 0);
                out = bigger; data = out.getChannelData(0);
            }
            const chans = [];
            for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
            const nc = chans.length;
            const moving = SO.spatial.isMoving(stem.asset);
            const pathSec = (+stem.asset.duration > 0) ? stem.asset.duration / 1000 : buf.duration;
            const fixed = moving ? 0 : SO.spatial.gainAt(stem.asset, mySeat, 0, pathSec);
            let gainSum = 0;
            for (let i0 = 0; i0 < buf.length; i0 += MIX_YIELD_SAMPLES) {
                const i1 = Math.min(buf.length, i0 + MIX_YIELD_SAMPLES);
                for (let i = i0; i < i1; ) {
                    const j = Math.min(i1, i + MIX_GAIN_STEP);
                    let g0 = fixed, g1 = fixed;
                    if (moving) {
                        g0 = SO.spatial.gainAt(stem.asset, mySeat, i / rate, pathSec);
                        g1 = SO.spatial.gainAt(stem.asset, mySeat, j / rate, pathSec);
                    }
                    gainSum += g0 * (j - i);
                    if (g0 !== 0 || g1 !== 0) {
                        const step = (g1 - g0) / (j - i);
                        for (let k = i, g = g0; k < j; k++, g += step) {
                            let s = chans[0][k];
                            if (nc > 1) { for (let c = 1; c < nc; c++) s += chans[c][k]; s /= nc; }   // stereo → mono
                            const v = (data[start + k] += s * g);
                            if (v > peak) peak = v; else if (-v > peak) peak = -v;
                        }
                    }
                    i = j;
                }
                await new Promise(r => setTimeout(r, 0));
                if (entry.cancelled) throw cancelledError();
            }
            await addStemLight(lightAcc, chans, start, rate, stem,
                t => moving ? SO.spatial.gainAt(stem.asset, mySeat, t, pathSec) : fixed, entry);
            log(`🎚️ ${entry.name}: ${stem.id} at ${(gainSum / buf.length * 100).toFixed(0)}% average level${moving ? ' (moving)' : ''}`, 'debug');
            buf = null; chans.length = 0;   // drop the decoded stem before the next one
        }
        if (!out) out = new AudioBuffer({ numberOfChannels: 1, length: Math.max(1, Math.round(rate * 0.1)), sampleRate: rate });
        entry.peak = peak;
        entry.light = finishLight(lightAcc);
        if (entry.light.flashesHeld) log(`💡 "${entry.name}": ${entry.light.flashesHeld} flashes held steady (over ${LIGHT.MAX_FLASHES_PER_S}/s)`, 'info');
        const mb = out.length * 4 / 1048576;
        log(`🎛️ Mix ready: "${entry.name}" ${entry.plan.stems.length} stems → ${out.duration.toFixed(1)} s mono, ${mb.toFixed(0)} MB, ` +
            `built in ${((performance.now() - t0) / 1000).toFixed(1)} s, peak ${peak.toFixed(2)}`, peak > 1 ? 'warn' : 'info');
        if (peak > 1) log(`⚠️ "${entry.name}" peaks at ${peak.toFixed(2)} at this seat: it will clip (the separate-stem player clipped the same way)`, 'warn');
        return out;
    }

    // Returns the mix entry for a movement, building it if needed (one build at a time).
    function ensureMix(name, plan) {
        let entry = mixes.get(name);
        if (entry && entry.signature === plan.signature && !entry.failed && !entry.cancelled) return entry;
        if (entry) releaseMix(name);
        entry = { name, plan, signature: plan.signature, buffer: null, cancelled: false, failed: false };
        entry.promise = mixChain.then(async () => {
            if (entry.cancelled) throw cancelledError();
            entry.buffer = await buildMix(entry);
            return entry.buffer;
        });
        entry.promise.catch(e => {
            if (e.cancelled) { log(`🗑️ Mix "${name}" cancelled`, 'debug'); return; }
            entry.failed = true;
            log(`❌ Mix "${name}" failed: ${e.message}`, 'error');
        });
        mixChain = entry.promise.catch(() => {});
        mixes.set(name, entry);
        return entry;
    }

    function releaseMix(name) {
        const entry = mixes.get(name);
        if (!entry) return;
        entry.cancelled = true;
        entry.buffer = null;
        entry.light = null;
        mixes.delete(name);
    }

    // Keep only what is playing plus the movement after `name`; start building that one.
    function prepareNextMovement(name) {
        const i = showMovements.findIndex(m => movementName(m) === name);
        const next = i >= 0 ? showMovements[i + 1] : (name === null ? showMovements[0] : null);
        const nextName = next ? movementName(next) : null;
        for (const key of [...mixes.keys()]) {
            if (key !== nextName && !playingMovements.has(key) && key !== name) releaseMix(key);
        }
        if (!next) return;
        const entry = ensureMix(nextName, planMovement(next.cues));
        log(`⏭️ Preparing next movement "${nextName}" (${entry.plan.stems.length} stems for this seat)`, 'info');
    }

    function stopMovement(name, fadeSec = 0.1) {
        const p = playingMovements.get(name);
        if (!p) return;
        playingMovements.delete(name);
        const t = audioCtx.currentTime;
        try {
            p.gain.gain.cancelScheduledValues(t);
            p.gain.gain.setValueAtTime(p.gain.gain.value, t);
            p.gain.gain.linearRampToValueAtTime(0, t + fadeSec);
            p.source.stop(t + fadeSec + 0.02);
        } catch (e) {}
    }

    // --- GO: play this movement's mix (other movements keep playing) -------------
    let movementToken = 0;
    function handleMovementStart(cue) {
        if (!cue.startTime || !cue.movement || !cue.cues) return;
        const name = cue.movement;
        log(`🎬 MOVEMENT START: "${name}"`);
        stopIdleClockRechecks();
        currentMovement = name;
        movementStartTime = cue.startTime;
        const indicator = document.getElementById('movement-indicator');
        if (indicator) indicator.querySelector('.status-text').innerText = name;
        stopMovement(name);   // a second GO for the same movement restarts it
        const token = ++movementToken;
        const plan = planMovement(cue.cues);
        if (!plan.stems.length) {
            log(`🔇 "${name}": no stems reach this seat`, 'info');
            prepareNextMovement(name);
            if (!playingMovements.size) clockRecheckWhenQuiet();
            return;
        }
        // An unplanned jump: stop building anything else so this one starts sooner
        for (const [key, e] of mixes) if (key !== name && !e.buffer && !playingMovements.has(key)) releaseMix(key);
        const entry = ensureMix(name, plan);
        if (!entry.buffer) log(`⏳ "${name}" mix not ready yet; it will join late`, 'warn');
        entry.promise.then(buffer => {
            if (token !== movementToken && playingMovements.has(name)) return;   // superseded by a restart
            if (mixes.get(name) !== entry) return;
            const leadMs = (currentSpeakerDelay || 0) + (myMicDelayMs || 0);   // speaker + mic delay (deliberate)
            // playAt primes the mix (0.1 s at gain 0.001) before its first play
            const r = SO.audio.playAt(audioCtx, buffer, cue.startTime, {
                leadMs, gain: 1.0, destination: masterGain || audioCtx.destination,
                lateLimitMs: buffer.duration * 1000   // join late rather than stay silent
            });
            if (r.skipped) { log(`❌ "${name}" skipped: ${r.reason}`, 'error'); return; }
            if (r.lateMs > 0) log(`⚠️ "${name}" ${Math.round(r.lateMs)} ms late, joined ${r.offset.toFixed(2)} s in`, 'warn');
            const playing = { source: r.source, gain: r.gain, entry, when: r.when, offset: r.offset, leadSec: leadMs / 1000 };
            playingMovements.set(name, playing);
            r.source.onended = () => {
                try { r.gain.disconnect(); } catch (e) {}
                if (playingMovements.get(name) === playing) playingMovements.delete(name);
                if (!playingMovements.has(name) && mixes.get(name) === entry) {
                    const i = showMovements.findIndex(m => movementName(m) === name);
                    // keep it if it is the next one up (e.g. a restart); otherwise free it
                    const playingNames = [...playingMovements.keys()];
                    const isNext = playingNames.some(n => {
                        const j = showMovements.findIndex(m => movementName(m) === n);
                        return j >= 0 && j + 1 === i;
                    });
                    if (!isNext) releaseMix(name);
                }
                log(`🏁 "${name}" finished`, 'info');
                if (!playingMovements.size) clockRecheckWhenQuiet();   // end of the movement(s)
            };
        }).catch(() => {}).finally(() => {
            if (token === movementToken) prepareNextMovement(name);
        });
    }

    // KILL reloads the page; this is for a stop without a reload.
    function clearAllScheduledCues() {
        activeTimeouts.forEach(t => clearTimeout(t)); activeTimeouts = [];
        for (const name of [...playingMovements.keys()]) stopMovement(name);
        activeAudioCues = [];
        activeLightCues = [];
        const canvas = document.getElementById('stage-canvas');
        if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        lastLightCss = '';
    }
    function frame(now) {
        drawLights(now);
        const delta = now - lastFrameTime;
        if (delta < FRAME_DURATION) { requestAnimationFrame(frame); return; }
        lastFrameTime = now;
        const serverNow = SO.now();
        const movInd = document.getElementById('movement-indicator');
        if (movInd) {
            if (currentMovement && movementStartTime > serverNow) {
                const t = ((movementStartTime - serverNow)/1000).toFixed(1);
                movInd.querySelector('.status-text').innerText = `${currentMovement} (T-${t}s)`;
            } else if (currentMovement) {
                movInd.querySelector('.status-text').innerText = `${currentMovement} (Playing)`;
            }
        }
        const fps = Math.round(1000 / delta);
        document.getElementById('performance-overlay').innerHTML = `FPS: ${fps} | Speaker: ${currentSpeakerDelay?.toFixed(0) || '--'}ms | Mic: ${myMicDelayMs?.toFixed(0) || '--'}ms | Neighbors: ${myNeighbors.length} | ${isHappy ? '😊' : (phase1Complete ? '🎵' : '🎤')}`;
        requestAnimationFrame(frame);
    }

    function initShowCueListener() {
        db.ref('show/currentCue').on('value', async snap => {
            const cue = snap.val();
            if (!cue) return;
            if (cue.action === 'KILL') {
                log("💀 KILL signal");
                location.reload();
            } else if (cue.action === 'GO') {
                handleMovementStart(cue);
            } else if (cue.type === 'SPEAKER_CAL' && cue.instrument === 'oboe') {
                const nowWall = SO.now();
                log(`📨 Oboe cue received at ${nowWall}, scheduled startTime=${cue.startTime}, delay=${(cue.startTime - nowWall).toFixed(1)}ms`, 'debug');
                if (mySeat.id === cue.targetSeat) {
                    // This device is the target – play the oboe
                    const oboeUrl = cue.audio_url;
                    if (!bufferCache[oboeUrl]) {
                        try {
                            bufferCache[oboeUrl] = await SO.audio.getBuffer(audioCtx, oboeUrl);
                        } catch (e) {
                            log(`❌ Failed to load oboe audio: ${e.message}`);
                            return;
                        }
                    }
                    const buffer = bufferCache[oboeUrl];
                    // Prime the hardware for oboe playback
                    await primeBuffer(buffer);
                    const leadMs = (currentSpeakerDelay || 0) + (myMicDelayMs || 0);   // speaker + mic delay (deliberate)
                    const r = SO.audio.playAt(audioCtx, buffer, cue.startTime, {
                        leadMs, gain: MASTER_PLAYBACK_GAIN, destination: masterGain || audioCtx.destination
                    });
                    if (r.skipped) log(`❌ Oboe skipped: ${r.reason}`, 'error');
                    else log(`🎵 Oboe sequence (${cue.notes.length} notes) starts in ${Math.max(0, (r.when - audioCtx.currentTime) * 1000).toFixed(0)}ms` +
                             (r.lateMs > 0 ? `, joined ${Math.round(r.lateMs)}ms late` : ''));
                } else {
                    // Check if we are a neighbor of the target seat
                    const neighborSnap = await db.ref(`neighbor_map/${cue.targetSeat}`).once('value');
                    const neighbors = neighborSnap.val() || [];
                    log(`🔍 Neighbor check: mySeat=${mySeat.id}, targetNeighbors=${neighbors.join(',')}, amINeighbor=${neighbors.includes(mySeat.id)}`, 'debug');
                    if (neighbors.includes(mySeat.id)) {
                        log(`👂 Listening for oboe calibration from ${cue.targetSeat}`);
                        startListeningForOboe(cue);
                    }
                }
            }
        });
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    const initBtn = document.getElementById('init-permissions-btn');
    if (initBtn) {
        initBtn.onclick = async () => {
            log("🖱️ Button pressed");
            initBtn.disabled = true;
            // iPhone: without this, the silent switch mutes Web Audio (the default session is
            // "ambient"). This page plays and listens, so it declares "play-and-record".
            if ('audioSession' in navigator) {
                try { navigator.audioSession.type = 'play-and-record'; log(`🔈 Audio session: ${navigator.audioSession.type}`); }
                catch (e) { log(`⚠️ Could not set audio session: ${e.message}`, 'warn'); }
            }
            const granted = await window.requestMicrophonePermission();
            if (granted) {
                log("✅ Mic granted");
                await setupMicrophone();
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                    log("🎛️ Audio context resumed");
                }
                if (mySeat && mySeat.id && assetsPreloaded) {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('show-screen').style.display = 'block';
                    const canvas = document.getElementById('stage-canvas');
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    showModeEntered = true;
                    await requestWakeLock();
                    requestAnimationFrame(frame);
                    initShowCueListener();
                    prepareNextMovement(null);   // mix the first movement now, while the house fills
                    initTuningListener();
                    startHeartbeat();
                    log("🚀 Entered show mode");
                } else {
                    log("⚠️ Not ready: assets still loading?");
                    initBtn.disabled = false;
                    updateDeviceStatusDisplay();
                }
            } else {
                log("❌ Mic permission denied");
                initBtn.disabled = false;
            }
        };
    }

    window.onload = async () => {
        log("🚀 Loading...");
        try {
            await resolveIdentity();
            // Measure the clock before anything is calibrated or played
            SO.clock.setDeviceId(mySeat.id);
            try { await SO.clock.sync(); } catch (e) { log(`⚠️ Clock sync failed, using Firebase's estimate: ${e.message}`, 'warn'); }
            startIdleClockRechecks();
            await loadNeighborMap();
            await loadTuningConfig();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = MASTER_PLAYBACK_GAIN;
            masterGain.connect(audioCtx.destination);
            await preloadAssets();
            await loadPillarData();

            // URL override for speaker/mic delays
            const urlParams = new URLSearchParams(window.location.search);
            const speakerParam = urlParams.get('speaker');
            const micParam = urlParams.get('mic');
            if (speakerParam !== null && micParam !== null) {
                const speaker = parseFloat(speakerParam);
                const mic = parseFloat(micParam);
                if (!isNaN(speaker) && !isNaN(mic)) {
                    currentSpeakerDelay = speaker;
                    myMicDelayMs = mic;
                    isHappy = true;
                    phase1Complete = true;
                    log(`🔧 Using URL overrides: speaker=${speaker}ms, mic=${mic}ms`);
                    saveCalibration();
                } else {
                    log(`⚠️ Invalid speaker/mic params: ${speakerParam}/${micParam}`);
                }
            } else {
                await loadStoredCalibration();
            }

            if (mySeat.id) initLogging();
            updateDeviceStatusDisplay();
            log("✅ Initialization complete");
        } catch (err) {
            log(`❌ Init error: ${err.message}`);
        }
    };

    window.onresize = () => {
        const canvas = document.getElementById('stage-canvas');
        if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        lastLightCss = '';   // resizing clears the canvas
    };
    window.addEventListener('beforeunload', () => { stopHeartbeat(); flushLogs(); });
</script>
</body>
</html>
